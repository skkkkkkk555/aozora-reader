<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Browser smoke test</title></head>
<body>
<iframe id="app-frame" title="app" style="width:100vw;height:100vh;border:0"></iframe>
<script>
const qs=new URLSearchParams(location.search);
const mode=qs.get('mode')||'desktop';
// テスト全体を有限時間で終了させる。個別waitForの合計が膨らんでも90秒を超えてハングしない。
const TEST_TIMEOUT=90000;
const frame=document.getElementById('app-frame');
const TEST_DEADLINE=Date.now()+TEST_TIMEOUT;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,Math.min(ms,Math.max(0,TEST_DEADLINE-Date.now()))));
const remaining=()=>Math.max(0,TEST_DEADLINE-Date.now());
function deadlineError(){return new Error('browser smoke global timeout ('+TEST_TIMEOUT+'ms)');}
async function waitFor(fn,timeout=12000,step=150){
  const localDeadline=Math.min(TEST_DEADLINE,Date.now()+timeout);
  while(Date.now()<localDeadline){
    try{const value=fn();if(value)return value;}catch{}
    const wait=Math.min(step,localDeadline-Date.now(),remaining());
    if(wait<=0)break;
    await sleep(wait);
  }
  if(Date.now()>=TEST_DEADLINE)throw deadlineError();
  throw new Error('timeout');
}
function fail(message){throw new Error(message);}
function visible(el){
  if(!el)return false;
  const cs=el.ownerDocument.defaultView.getComputedStyle(el);
  return !el.hidden&&cs.display!=='none'&&cs.visibility!=='hidden';
}
function textOf(el){
  return String(el?.textContent||'').replace(/\s+/g,' ').trim();
}
function readerText(d){
  return textOf(d.querySelector('#phone-reader-body'))||textOf(d.querySelector('#body'));
}
function readerRendered(d,selector){
  const el=d.querySelector(selector);
  if(!visible(el))return false;
  const rect=el.getBoundingClientRect();
  const cs=el.ownerDocument.defaultView.getComputedStyle(el);
  return rect.width>0&&rect.height>0&&cs.opacity!=='0'&&textOf(el).length>80;
}
function readerScrollable(d,selector){
  const el=d.querySelector(selector);
  return !!el&&el.clientHeight>0&&el.scrollHeight>el.clientHeight;
}
function readerAxisScrollable(d,selector){
  const el=d.querySelector(selector);
  return !!el&&el.clientWidth>0&&el.scrollWidth>el.clientWidth+2;
}
function runtimeErrors(d){return Array.from(d?.defaultView?.__aozoraRuntimeErrors||[]);}
function clearRuntimeErrors(d){const list=d?.defaultView?.__aozoraRuntimeErrors;if(Array.isArray(list))list.length=0;}
function assertNoRuntimeErrors(d,label){const errors=runtimeErrors(d);if(errors.length)fail(label+': '+JSON.stringify(errors));}
function assertDesktopReaderChrome(d,label){
  const reader=d.querySelector('#reader');
  if(!reader?.classList.contains('open'))fail(label+': reader not open');
  for(const selector of ['#r-top','#r-dock','#r-bottom-info']){
    const el=d.querySelector(selector);
    if(!visible(el))fail(label+': '+selector+' not visible');
    const cs=d.defaultView.getComputedStyle(el);
    if(cs.pointerEvents==='none')fail(label+': '+selector+' pointer-events none');
    if(Number(cs.opacity)<0.99)fail(label+': '+selector+' opacity '+cs.opacity);
    if(el.classList.contains('hide'))fail(label+': '+selector+' still has hide class');
  }
}
(async()=>{
  const live=mode==='live'||mode==='live-mobile';
  frame.src='../reader-latest.html?browser-smoke='+Date.now()+(live?'&browser-smoke-live=1':'');
  await new Promise((resolve,reject)=>{
    let timer=0;
    const finish=(fn,value)=>{clearTimeout(timer);frame.removeEventListener('load',onload);frame.removeEventListener('error',onerror);fn(value);};
    const onload=()=>finish(resolve);
    const onerror=()=>finish(reject,new Error('iframe load failed'));
    const limit=Math.min(10000,remaining());
    if(limit<=0)return reject(deadlineError());
    timer=setTimeout(()=>reject(Date.now()>=TEST_DEADLINE?deadlineError():new Error('iframe load timeout')),limit);
    frame.addEventListener('load',onload,{once:true});
    frame.addEventListener('error',onerror,{once:true});
  });
  const d=frame.contentDocument;
  await waitFor(()=>d?.documentElement?.dataset?.device,10000);
  await sleep(500);
  assertNoRuntimeErrors(d,'runtime error during startup');
  clearRuntimeErrors(d);
  const device=d.documentElement.dataset.device;

  if(mode==='live'){
    const probe='https://cdn.jsdelivr.net/gh/aozorahack/aozorabunko_text@master/cards/000148/files/789_ruby_5639/789_ruby_5639.txt';
    const probeRes=await fetch(probe,{cache:'no-store'});
    if(!probeRes.ok)fail('jsDelivr Aozora source unavailable: HTTP '+probeRes.status);
    const probeText=await probeRes.text();
    if(probeText.length<200)fail('jsDelivr Aozora source returned too little data');
    const titles=['吾輩は猫である','こころ','羅生門','走れメロス','銀河鉄道の夜'];
    const readOne=async(title)=>{
      const nav=await waitFor(()=>d.querySelector('[data-act="nav"][data-v="v-search"]'),5000);
      nav.click();
      const input=await waitFor(()=>d.querySelector('#q-input'),5000);
      input.value='';
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.value=title;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      const result=await waitFor(()=>d.querySelector('#search-tiles [data-act="open-book"]'),15000);
      result.click();
      clearRuntimeErrors(d);
      const readNow=await waitFor(()=>d.querySelector('#sheet [data-act="read-now"]'),5000);
      assertNoRuntimeErrors(d,'live after book detail open');
      clearRuntimeErrors(d);
      readNow.click();
      await sleep(100);
      assertNoRuntimeErrors(d,'live immediately after read click');
      clearRuntimeErrors(d);
      await waitFor(()=>d.querySelector('#reader')?.classList.contains('open'),7000);
      await waitFor(()=>readerRendered(d,'#body')&&!/本文を読み込めませんでした/.test(readerText(d)),45000);
      assertNoRuntimeErrors(d,'live after reader render');
      clearRuntimeErrors(d);
      const body=d.querySelector('#body');
      if(!readerScrollable(d,'#body'))fail('live reader body is not actually scrollable: '+title);
      const before=body.scrollTop;
      body.scrollTop=Math.min(600,before+600);
      await sleep(300);
      if(body.scrollTop<=before)fail('live reader body did not scroll: '+title);
      const back=await waitFor(()=>d.querySelector('[data-act="r-back"]'),4000);
      back.click();
      assertNoRuntimeErrors(d,'live after reader back');
      clearRuntimeErrors(d);
      await waitFor(()=>!d.querySelector('#reader')?.classList.contains('open'),7000);
    };
    for(const title of titles)await readOne(title);
    document.title='LIVE_SMOKE_OK';
    document.body.textContent='LIVE_SMOKE_OK';
    return;
  }

  if(mode==='mobile'||mode==='live-mobile'){
    if(mode==='live-mobile'){
      const probe='https://cdn.jsdelivr.net/gh/aozorahack/aozorabunko_text@master/cards/000148/files/789_ruby_5639/789_ruby_5639.txt';
      const probeRes=await fetch(probe,{cache:'no-store'});
      if(!probeRes.ok)fail('jsDelivr Aozora source unavailable: HTTP '+probeRes.status);
      const probeText=await probeRes.text();
      if(probeText.length<200)fail('jsDelivr Aozora source returned too little data');
    }
    if(device!=='smartphone')fail('smartphone detection failed: '+device);

    const homeBook=await waitFor(()=>d.querySelector('#phone-content [data-phone-work]'),18000);
    const testTitle=textOf(homeBook.querySelector('.phone-book-name,.phone-book-title-big'))||textOf(homeBook);
    if(testTitle.length<2)fail('smartphone home book title missing');
    clearRuntimeErrors(d);
    homeBook.click();
    clearRuntimeErrors(d);
    await sleep(100);
    assertNoRuntimeErrors(d,'mobile after home book open');
    clearRuntimeErrors(d);

    await sleep(100);
    assertNoRuntimeErrors(d,'mobile after home book open');
    clearRuntimeErrors(d);
    const more=await waitFor(()=>d.querySelector('#phone-detail [data-phone-action="detail-more"]'),4000);
    more.click();
    await waitFor(()=>d.querySelector('#phone-sheet')?.classList.contains('open'),5000);
    const sheetClose=await waitFor(()=>d.querySelector('#phone-sheet [data-phone-action="sheet-close"]'),4000);
    sheetClose.click();
    await waitFor(()=>!d.querySelector('#phone-sheet')?.classList.contains('open'),5000);

    const detailBackButton=d.querySelector('#phone-detail [data-phone-action="detail-back"]');
    if(!detailBackButton||!visible(detailBackButton))fail('smartphone detail back button is not visible');
    detailBackButton.click();
    await sleep(100);
    await waitFor(()=>!visible(d.querySelector('#phone-detail')),4000);
    // 再び同じ作品を開き、続くreader検証へ戻る。
    const reopen=await waitFor(()=>d.querySelector('#phone-content [data-phone-work]'),5000);
    reopen.click();
    await waitFor(()=>visible(d.querySelector('#phone-detail')),5000);

    const read=await waitFor(()=>d.querySelector('#phone-detail [data-phone-action="detail-read"]'),6000);
    clearRuntimeErrors(d);
    read.click();
    assertNoRuntimeErrors(d,'mobile immediately after read click');
    clearRuntimeErrors(d);
    await sleep(150);
    assertNoRuntimeErrors(d,'mobile immediately after read click');
    clearRuntimeErrors(d);
    const loadLayer=await waitFor(()=>d.querySelector('#phone-reader-loading-layer'),5000);
    if(loadLayer.parentElement?.id!=='phone-reader')throw new Error('mobile reader loader is not isolated');
    await waitFor(()=>visible(d.querySelector('#phone-reader'))&&d.querySelector('#phone-reader').classList.contains('phone-open'),6000);
    const phoneReaderOpacity=d.defaultView.getComputedStyle(d.querySelector('#phone-reader')).opacity;
    if(Number(phoneReaderOpacity)<0.99)throw new Error('smartphone reader still fades during transition');
    if(d.querySelector('#phone-reader-body .aozora-loader'))throw new Error('mobile loader leaked into article body');
    await waitFor(()=>readerRendered(d,'#phone-reader-body')&&!/本文を読み込めませんでした/.test(readerText(d)),30000);
    if(d.querySelector('#phone-reader-loading-layer')?.hidden===false)throw new Error('mobile loader did not hide after render');
    if(!readerScrollable(d,'#phone-reader-body'))fail('smartphone reader body is not actually scrollable');
    const mobileUiRestore=d.querySelector('#phone-reader .phone-reader-ui-toggle');
    if(!mobileUiRestore||!visible(mobileUiRestore))fail('smartphone reader UI restore button is not visible');
    if(!/UI表示/.test(textOf(mobileUiRestore)))fail('smartphone reader UI restore button label missing');
    d.querySelector('#phone-reader')?.classList.add('reader-chrome-hidden');
    mobileUiRestore.click();
    await sleep(80);
    if(d.querySelector('#phone-reader')?.classList.contains('reader-chrome-hidden'))fail('smartphone reader UI restore button did not restore UI');
    clearRuntimeErrors(d);
    if(textOf(d.querySelector('#phone-reader-body')).replace(/\s+/g,'').length<20)fail('smartphone reader body has no readable text');
    assertNoRuntimeErrors(d,'mobile after reader render');
    clearRuntimeErrors(d);
    assertNoRuntimeErrors(d,'mobile after reader render');
    clearRuntimeErrors(d);

    // Mobile/tablet vertical reader regression: the option must be reachable from the reader menu.
    const readerMoreForVertical=await waitFor(()=>d.querySelector('#phone-reader [data-phone-action="reader-more"]'),4000);
    readerMoreForVertical.click();
    await waitFor(()=>d.querySelector('#phone-sheet [data-phone-action="reader-vertical"]'),5000);
    d.querySelector('#phone-sheet [data-phone-action="reader-vertical"]').click();
    await sleep(120);
    if(!d.querySelector('#phone-reader-body')?.classList.contains('phone-reader-vertical'))fail('smartphone vertical reader did not activate');
    if(d.defaultView.getComputedStyle(d.querySelector('#phone-reader-body')).touchAction!=='pan-x')fail('smartphone vertical reader touch axis is not horizontal');
    const phoneVerticalBody=d.querySelector('#phone-reader-body');
    if(!phoneVerticalBody.querySelector('.reader-flow.reader-vertical-flow'))fail('smartphone vertical reader flow wrapper is missing');
    if(!readerAxisScrollable(d,'#phone-reader-body'))fail('smartphone vertical reader has no horizontal overflow');
    {
      const beforeX=phoneVerticalBody.scrollLeft;
      phoneVerticalBody.dispatchEvent(new WheelEvent('wheel',{deltaY:420,bubbles:true,cancelable:true}));
      await sleep(80);
      if(phoneVerticalBody.scrollLeft===beforeX)fail('smartphone vertical reader did not respond to horizontal-axis wheel');
    }
    if(d.querySelector('#phone-reader')?.classList.contains('reader-chrome-hidden'))fail('smartphone vertical reader lost chrome');
    await waitFor(()=>d.querySelector('#phone-reader .phone-reader-ui-toggle')&&visible(d.querySelector('#phone-reader .phone-reader-ui-toggle')),4000);
    d.querySelector('#phone-reader [data-phone-action="reader-more"]')?.click();
    if(d.querySelector('#phone-reader-body')?.classList.contains('phone-reader-vertical')===false)fail('smartphone vertical reader toggled off unexpectedly');

    const readerSearch=d.querySelector('#phone-reader [data-phone-action="reader-search"]');
    if(!readerSearch)fail('smartphone reader search action missing');
    readerSearch.click();
    await waitFor(()=>!d.querySelector('#phone-reader-search')?.hidden,4000);
    const readerSearchClose=await waitFor(()=>d.querySelector('#phone-reader [data-phone-action="reader-search-close"]'),4000);
    clearRuntimeErrors(d);
    readerSearchClose.click();
    await sleep(100);
    assertNoRuntimeErrors(d,'mobile after reader search close');
    clearRuntimeErrors(d);
    await waitFor(()=>d.querySelector('#phone-reader-search')?.hidden,4000);
    assertNoRuntimeErrors(d,'mobile after reader search close');
    clearRuntimeErrors(d);

    // グローバル戻るはオーバーレイしない設計。実際のヘッダー戻るを検査する。
    const readerHeaderBack=d.querySelector('#phone-reader [data-phone-action="reader-back"]');
    if(!readerHeaderBack||!visible(readerHeaderBack))fail('smartphone reader header back button is not visible');

    const readerGlobalBack=d.querySelector('#phone-global-back');
    if(!readerGlobalBack||!visible(readerGlobalBack))fail('smartphone global back is not visible in reader');
    readerGlobalBack.click();
    await sleep(100);
    await waitFor(()=>!d.querySelector('#phone-reader')?.classList.contains('phone-open'),5000);
    await waitFor(()=>visible(d.querySelector('#phone-detail')),4000);
    // readerを再度開いて、個別の戻るボタン経路も検証する。
    d.querySelector('#phone-detail [data-phone-action="detail-read"]').click();
    await waitFor(()=>visible(d.querySelector('#phone-reader'))&&d.querySelector('#phone-reader').classList.contains('phone-open'),5000);
    await waitFor(()=>readerRendered(d,'#phone-reader-body'),20000);
    // Android実機の戻るを history.back() で再現。読書→作品詳細へ戻れることを検証する。
    d.defaultView.history.back();
    await waitFor(()=>!d.querySelector('#phone-reader')?.classList.contains('phone-open'),5000);
    await waitFor(()=>visible(d.querySelector('#phone-detail')),4000);
    // 読書画面を再度開き、画面内の戻るボタンも別経路として検証する。
    d.querySelector('#phone-detail [data-phone-action="detail-read"]')?.click();
    await waitFor(()=>d.querySelector('#phone-reader')?.classList.contains('phone-open'),5000);
    await waitFor(()=>readerRendered(d,'#phone-reader-body'),20000);
    const readerBack=await waitFor(()=>d.querySelector('#phone-reader [data-phone-action="reader-back"]'),4000);
    clearRuntimeErrors(d);
    readerBack.click();
    assertNoRuntimeErrors(d,'mobile after reader back');
    clearRuntimeErrors(d);
    await waitFor(()=>!d.querySelector('#phone-reader')?.classList.contains('phone-open'),5000);
    assertNoRuntimeErrors(d,'mobile after reader back');
    clearRuntimeErrors(d);
    await waitFor(()=>visible(d.querySelector('#phone-detail')),4000);

    const detailBack=await waitFor(()=>d.querySelector('#phone-detail [data-phone-action="detail-back"]'),4000);
    clearRuntimeErrors(d);
    detailBack.click();
    assertNoRuntimeErrors(d,'mobile after detail back');
    clearRuntimeErrors(d);
    await waitFor(()=>!visible(d.querySelector('#phone-detail')),5000);
    assertNoRuntimeErrors(d,'mobile after detail back');
    clearRuntimeErrors(d);

    const searchTab=await waitFor(()=>d.querySelector('[data-phone-tab="search"]'),4000);
    searchTab.click();
    const input=await waitFor(()=>d.querySelector('#phone-search-input'),5000);
    input.value='吾輩は猫である';
    input.dispatchEvent(new Event('input',{bubbles:true}));
    await waitFor(()=>d.querySelector('#phone-search-results [data-phone-work]'),12000);

    // Android戻るで通常タブの履歴も1段ずつ戻れることを確認。
    const searchTabForHistory=await waitFor(()=>d.querySelector('[data-phone-tab="search"]'),4000);
    searchTabForHistory.click();
    await waitFor(()=>d.querySelector('#phone-search-input'),5000);
    const shelfTabForHistory=await waitFor(()=>d.querySelector('[data-phone-tab="shelf"]'),4000);
    shelfTabForHistory.click();
    await waitFor(()=>d.querySelector('#phone-title')&&textOf(d.querySelector('#phone-title'))==='本棚',4000);
    const settings=await waitFor(()=>d.querySelector('[data-phone-tab="settings"]'),4000);
    settings.click();
    await waitFor(()=>d.querySelector('#phone-content [data-phone-action="theme"]'),5000);
    d.defaultView.history.back();
    await waitFor(()=>textOf(d.querySelector('#phone-title'))==='本棚',5000);
    d.defaultView.history.back();
    await waitFor(()=>textOf(d.querySelector('#phone-title'))==='探す',5000);
    d.defaultView.history.back();
    await waitFor(()=>textOf(d.querySelector('#phone-title'))==='今読む',5000);
    const toastProbe=new Error('通知サイズ検査');
    d.defaultView.toast?.('通知サイズ検査');
    await sleep(80);
    const toastRect=d.querySelector('#toast')?.getBoundingClientRect();
    if(toastRect&&toastRect.width>320)fail('smartphone toast is oversized: '+toastRect.width);
    d.querySelector('#phone-content [data-phone-action="theme"]').click();
    await waitFor(()=>d.querySelector('#phone-content [data-phone-action="reader-font"]'),4000);
    d.querySelector('#phone-content [data-phone-action="reader-font"]').click();
    const readerMore=await waitFor(()=>d.querySelector('#phone-content [data-phone-action="reader-more"]'),4000);
    readerMore.click();
    await waitFor(()=>d.querySelector('#phone-sheet')?.classList.contains('open'),5000);
    const settingsSheetClose=await waitFor(()=>d.querySelector('#phone-sheet [data-phone-action="sheet-close"]'),4000);
    settingsSheetClose.click();
    await waitFor(()=>!d.querySelector('#phone-sheet')?.classList.contains('open'),5000);
    if(mode==='live-mobile'){
      document.title='LIVE_MOBILE_SMOKE_OK';
      document.body.textContent='LIVE_MOBILE_SMOKE_OK';
      return;
    }
  }else{
    if(device==='smartphone')fail('desktop detection unexpectedly smartphone');

    await waitFor(()=>d.body.classList.contains('app-ready'),20000);
    const search=await waitFor(()=>d.querySelector('[data-act="nav"][data-v="v-search"]'),5000);
    search.click();
    const input=await waitFor(()=>d.querySelector('#q-input'),5000);
    input.value='吾輩は猫である';
    input.dispatchEvent(new Event('input',{bubbles:true}));
    await sleep(500);

    const result=await waitFor(()=>d.querySelector('#search-tiles [data-act="open-book"]'),15000);
    clearRuntimeErrors(d);
    result.click();
    await waitFor(()=>d.querySelector('#sheet')?.classList.contains('open'),5000);
    assertNoRuntimeErrors(d,'desktop after book detail open');
    clearRuntimeErrors(d);

    const close=await waitFor(()=>d.querySelector('#sheet [data-act="close-sheet"]'),4000);
    clearRuntimeErrors(d);
    close.click();
    assertNoRuntimeErrors(d,'desktop after detail sheet close');
    clearRuntimeErrors(d);
    await waitFor(()=>!d.querySelector('#sheet')?.classList.contains('open'),5000);
    assertNoRuntimeErrors(d,'desktop after detail sheet close');
    clearRuntimeErrors(d);

    result.click();
    await waitFor(()=>d.querySelector('#sheet')?.classList.contains('open'),5000);
    const readNow=await waitFor(()=>d.querySelector('#sheet [data-act="read-now"]'),5000);
    clearRuntimeErrors(d);
    readNow.click();
    assertNoRuntimeErrors(d,'desktop immediately after read click');
    clearRuntimeErrors(d);
    const loadLayer=await waitFor(()=>d.querySelector('#reader-loading-layer'),5000);
    if(loadLayer.parentElement?.id!=='reader')throw new Error('desktop reader loader is not isolated');
    await waitFor(()=>d.querySelector('#reader')?.classList.contains('open'),7000);
    await sleep(150);
    assertNoRuntimeErrors(d,'desktop immediately after read click');
    clearRuntimeErrors(d);
    const readerOpacity=d.defaultView.getComputedStyle(d.querySelector('#reader')).opacity;
    if(Number(readerOpacity)<0.99)throw new Error('desktop reader still fades over the previous UI');
    assertDesktopReaderChrome(d,'desktop reader chrome after open');
    const uiRestore=d.querySelector('#r-ui-toggle');
    if(!uiRestore||!visible(uiRestore))fail('desktop reader UI restore button is not visible');
    if(!/UI表示/.test(textOf(uiRestore)))fail('desktop reader UI restore button label missing');
    if(uiRestore.closest('#reader'))fail('desktop reader UI restore button must stay outside #reader');
    if(d.querySelector('#body .aozora-loader'))throw new Error('desktop loader leaked into article body');
    await waitFor(()=>readerRendered(d,'#body')&&textOf(d.querySelector('#body')).length>80,30000);
    if(d.querySelector('#reader-loading-layer')?.hidden===false)throw new Error('desktop loader did not hide after render');
    const bodyVis=d.defaultView.getComputedStyle(d.querySelector('#body'));
    if(bodyVis.visibility==='hidden'||Number(bodyVis.opacity)<0.99)fail('desktop reader body is hidden after render');
    if(!readerScrollable(d,'#body'))fail('desktop reader body is not actually scrollable');
    if(textOf(d.querySelector('#body')).replace(/\s+/g,'').length<20)fail('desktop reader body has no readable text');
    assertNoRuntimeErrors(d,'desktop after reader render');
    clearRuntimeErrors(d);
    const desktopBody=d.querySelector('#body');
    desktopBody.scrollTop=Math.min(700,Math.max(0,desktopBody.scrollTop)+700);
    await sleep(250);
    assertDesktopReaderChrome(d,'desktop reader chrome after scrolling');
    clearRuntimeErrors(d);

    // 縦読み回帰テスト: 縦書き切替後にUIが消えたり、復帰不能になったりしないことを確認。
    const verticalToggle=await waitFor(()=>d.querySelector('#reader [data-act="r-vt"]'),4000);
    clearRuntimeErrors(d);
    verticalToggle.click();
    await sleep(300);
    if(!desktopBody.classList.contains('v'))fail('desktop vertical reader did not activate');
    if(!desktopBody.querySelector('.reader-flow.reader-vertical-flow'))fail('desktop vertical reader flow wrapper is missing');
    assertDesktopReaderChrome(d,'desktop reader chrome after vertical toggle');
    const verticalRestore=d.querySelector('#r-ui-toggle');
    if(!verticalRestore||!visible(verticalRestore)||verticalRestore.closest('#reader'))fail('desktop vertical UI restore control is unavailable');
    // 縦書き本文は横方向に進めてもUIを失わない。
    const horizontalScrollable=desktopBody.scrollWidth>desktopBody.clientWidth+2;
    if(!horizontalScrollable)fail('desktop vertical reader has no horizontal overflow');
    {
      const max=Math.max(0,desktopBody.scrollWidth-desktopBody.clientWidth);
      desktopBody.scrollLeft=max;
      const beforeX=desktopBody.scrollLeft;
      if(typeof d.defaultView.scrollDesktopVerticalBy!=='function')fail('desktop vertical scroll helper is missing');
      d.defaultView.scrollDesktopVerticalBy(480,desktopBody);
      await sleep(100);
      if(desktopBody.scrollLeft>=beforeX)fail('desktop vertical reader did not respond to wheel scrolling');
      // page turn must never apply a transform to the article surface.
      if(typeof d.defaultView.turnReaderPage!=='function')fail('desktop page-turn helper is missing');
      const beforeTransform=d.defaultView.getComputedStyle(desktopBody).transform;
      d.defaultView.turnReaderPage('next');
      await sleep(80);
      if(d.defaultView.getComputedStyle(desktopBody).transform!=='none'&&d.defaultView.getComputedStyle(desktopBody).transform!==beforeTransform)fail('desktop page turn transformed the article text');
      desktopBody.scrollLeft=beforeX;
    }
    assertDesktopReaderChrome(d,'desktop reader chrome after vertical paging');
    clearRuntimeErrors(d);
    verticalRestore.click();
    await sleep(120);
    assertDesktopReaderChrome(d,'desktop reader chrome after vertical UI restore');
    clearRuntimeErrors(d);
    verticalToggle.click();
    await sleep(250);
    if(desktopBody.classList.contains('v'))fail('desktop vertical reader did not return to horizontal mode');
    assertDesktopReaderChrome(d,'desktop reader chrome after vertical toggle off');
    clearRuntimeErrors(d);

    const readerSearch=d.querySelector('#reader [data-act="r-search-open"]');
    if(!readerSearch)fail('desktop reader search action missing');
    readerSearch.click();
    await waitFor(()=>d.querySelector('#r-search-bar')?.style.display==='flex'||d.querySelector('#r-search-bar')?.style.display==='block',4000);
    d.querySelector('#r-search-inp').value='夏目';
    d.querySelector('#r-search-inp').dispatchEvent(new Event('input',{bubbles:true}));
    d.querySelector('#reader [data-act="r-search-close"]')?.click();
    await sleep(100);
    assertNoRuntimeErrors(d,'desktop after reader search');
    clearRuntimeErrors(d);
    const uiToggle=d.querySelector('#r-ui-toggle');
    if(uiToggle){uiToggle.click();await sleep(120);assertDesktopReaderChrome(d,'desktop reader chrome after UI toggle');clearRuntimeErrors(d);}
    await sleep(100);
    assertNoRuntimeErrors(d,'desktop after reader search');
    clearRuntimeErrors(d);
    const uiToggle=d.querySelector('#r-ui-toggle');
    if(uiToggle){uiToggle.click();await sleep(120);assertDesktopReaderChrome(d,'desktop reader chrome after UI toggle');clearRuntimeErrors(d);}

    const back=await waitFor(()=>d.querySelector('[data-act="r-back"]'),4000);
    clearRuntimeErrors(d);
    back.click();
    assertNoRuntimeErrors(d,'desktop after reader back');
    clearRuntimeErrors(d);
    await waitFor(()=>!d.querySelector('#reader')?.classList.contains('open'),5000);
    assertNoRuntimeErrors(d,'desktop after reader back');
    clearRuntimeErrors(d);

    const settings=await waitFor(()=>d.querySelector('[data-act="nav"][data-v="v-settings"]'),4000);
    settings.click();
    await waitFor(()=>d.querySelector('#v-settings')?.classList.contains('active'),5000);
    const home=await waitFor(()=>d.querySelector('[data-act="nav"][data-v="v-home"]'),4000);
    home.click();
    await waitFor(()=>d.querySelector('#v-home')?.classList.contains('active'),4000);
  }
  document.title='SMOKE_OK';
  document.body.textContent='SMOKE_OK';
})().catch(error=>{
  document.title='SMOKE_FAIL';
  document.body.textContent='SMOKE_FAIL: '+(error?.stack||error?.message||String(error));
});
</script>
</body>
</html>
