<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Browser smoke test</title></head>
<body>
<iframe id="app-frame" title="app" style="width:100vw;height:100vh;border:0"></iframe>
<script>
const qs=new URLSearchParams(location.search);
const mode=qs.get('mode')||'desktop';
const frame=document.getElementById('app-frame');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,timeout=12000,step=150){
  const end=Date.now()+timeout;
  while(Date.now()<end){
    try{const v=fn();if(v)return v;}catch{}
    await wait(step);
  }
  throw new Error('timeout');
}
function fail(msg){throw new Error(msg);}
function visible(el){
  if(!el)return false;
  const cs=el.ownerDocument.defaultView.getComputedStyle(el);
  return !el.hidden&&cs.display!=='none'&&cs.visibility!=='hidden';
}
(async()=>{
  frame.src='../index.html?browser-smoke='+Date.now();
  await new Promise((resolve,reject)=>{
    frame.addEventListener('load',resolve,{once:true});
    frame.addEventListener('error',()=>reject(new Error('iframe load failed')),{once:true});
  });
  const d=frame.contentDocument;
  await waitFor(()=>d?.documentElement?.dataset?.device,10000);
  const device=d.documentElement.dataset.device;
  if(mode==='mobile'){
    if(device!=='smartphone')fail('smartphone detection failed: '+device);
    await waitFor(()=>d.querySelectorAll('#phone-content [data-phone-work]').length>0,16000);
    const books=[...d.querySelectorAll('#phone-content [data-phone-work]')].slice(0,8);
    let readOk=false;
    for(const book of books){
      book.click();
      try{
        const read=await waitFor(()=>d.querySelector('#phone-detail [data-phone-action="detail-read"]'),4500);
        read.click();
        await waitFor(()=>visible(d.querySelector('#phone-reader'))&&d.querySelector('#phone-reader').classList.contains('phone-open'),4000);
        await waitFor(()=>{
          const body=d.querySelector('#phone-reader-body');
          const text=(body?.innerText||'').trim();
          return text.length>80&&!/本文を読み込んでいます/.test(text)&&!/本文を読み込めませんでした/.test(text);
        },12000);
        readOk=true;
        const back=d.querySelector('#phone-reader [data-phone-action="reader-back"]');
        if(!back)fail('smartphone reader back missing');
        back.click();
        await waitFor(()=>!d.querySelector('#phone-reader')?.classList.contains('phone-open'),4000);
        await waitFor(()=>visible(d.querySelector('#phone-detail')),3000);
        const detailBack=d.querySelector('#phone-detail [data-phone-action="detail-back"]');
        if(!detailBack)fail('smartphone detail back missing');
        detailBack.click();
        await waitFor(()=>!visible(d.querySelector('#phone-detail')),4000);
        break;
      }catch(err){
        const rback=d.querySelector('#phone-reader [data-phone-action="reader-back"]');
        if(rback&&visible(d.querySelector('#phone-reader'))){try{rback.click()}catch{}}
        await wait(200);
        const dback=d.querySelector('#phone-detail [data-phone-action="detail-back"]');
        if(dback&&visible(d.querySelector('#phone-detail'))){try{dback.click()}catch{}}
        await wait(250);
      }
    }
    if(!readOk)fail('no smartphone book could render readable text');
    const settings=d.querySelector('[data-phone-tab="settings"]');
    if(!settings)fail('smartphone settings tab missing');
    settings.click();
    await waitFor(()=>d.querySelector('#phone-content [data-phone-action="theme"]'),4000);
    d.querySelector('#phone-content [data-phone-action="theme"]').click();
    await wait(250);
    const search=d.querySelector('[data-phone-tab="search"]');
    if(!search)fail('smartphone search tab missing');
    search.click();
    await waitFor(()=>d.querySelector('#phone-search-input'),4000);
  }else{
    if(device==='smartphone')fail('desktop detection unexpectedly smartphone');
    await waitFor(()=>d.querySelector('#v-home [data-act="open-book"]'),16000);
    const books=[...d.querySelectorAll('#v-home [data-act="open-book"]')].slice(0,8);
    let readOk=false;
    for(const book of books){
      book.click();
      try{
        await waitFor(()=>d.querySelector('#reader')?.classList.contains('open'),5000);
        await waitFor(()=>{
          const body=d.querySelector('#body');
          const text=(body?.innerText||'').trim();
          return text.length>80&&!/本文を読み込んでいます/.test(text)&&!/本文を読み込めませんでした/.test(text);
        },12000);
        readOk=true;
        d.querySelector('[data-act="r-back"]')?.click();
        await waitFor(()=>!d.querySelector('#reader')?.classList.contains('open'),4000);
        break;
      }catch(err){
        d.querySelector('[data-act="r-back"]')?.click();
        await wait(250);
      }
    }
    if(!readOk)fail('no desktop book could render readable text');
    const settings=d.querySelector('[data-act="nav"][data-v="v-settings"]');
    if(!settings)fail('desktop settings navigation missing');
    settings.click();
    await waitFor(()=>d.querySelector('#v-settings')?.classList.contains('active'),4000);
    const search=d.querySelector('[data-act="nav"][data-v="v-search"]');
    if(!search)fail('desktop search navigation missing');
    search.click();
    await waitFor(()=>d.querySelector('#q-input'),4000);
  }
  document.title='SMOKE_OK';
  document.body.textContent='SMOKE_OK';
})().catch(err=>{
  document.title='SMOKE_FAIL';
  document.body.textContent='SMOKE_FAIL: '+(err?.stack||err?.message||String(err));
});
</script>
</body>
</html>
