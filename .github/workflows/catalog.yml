name: Update Aozora catalog

on:
  push:
    paths:
      - 'scripts/build-catalog.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog
        run: python3 scripts/build-catalog.py

      - name: Commit catalog when changed
        run: |
          if [ -z "$(git status --porcelain -- catalog.json)" ]; then
            echo "Catalog is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update Aozora catalog"
          git push
