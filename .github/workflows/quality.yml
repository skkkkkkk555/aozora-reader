name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static quality
        run: node scripts/quality-check.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    needs: static-quality
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/aozora-http.log 2>&1 &
          echo $! >/tmp/aozora-http.pid
          sleep 1
      - name: Run smartphone smoke test
        run: |
          BROWSER="$(command -v chromium || command -v google-chrome || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 60s "$BROWSER"             --headless             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --window-size=412,915             --user-agent='Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36'             --virtual-time-budget=30000             --dump-dom             'http://127.0.0.1:4173/scripts/browser-smoke.html?mode=mobile'             > /tmp/mobile-smoke.html
          grep -q 'SMOKE_OK' /tmp/mobile-smoke.html
      - name: Run desktop smoke test
        run: |
          BROWSER="$(command -v chromium || command -v google-chrome || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 60s "$BROWSER"             --headless             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --window-size=1440,1000             --virtual-time-budget=30000             --dump-dom             'http://127.0.0.1:4173/scripts/browser-smoke.html?mode=desktop'             > /tmp/desktop-smoke.html
          grep -q 'SMOKE_OK' /tmp/desktop-smoke.html
      - name: Show smoke logs on failure
        if: failure()
        run: cat /tmp/aozora-http.log || true
      - name: Stop local server
        if: always()
        run: kill "$(cat /tmp/aozora-http.pid)" 2>/dev/null || true
